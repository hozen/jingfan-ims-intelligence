<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>靖帆IMS Intelligence</title><style>:root{--ink:#17212b;--muted:#647582;--line:#d9e4e8;--bg:#f4f7f8;--blue:#0e628c;--mun:#176a49}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:16px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,5vw,36px)}.muted{font-size:14px;color:var(--muted)}.toolbar{padding:8px 0}.search{width:100%;padding:12px;border:1px solid #b8cbd4;border-radius:10px;background:#fff;font:inherit}.filters{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px}.filter{flex:0 0 auto;border:1px solid #b8cbd4;border-radius:99px;padding:6px 11px;background:#fff;font:14px inherit;cursor:pointer}.filter.selected{background:var(--blue);border-color:var(--blue);color:#fff}.filter.municipal.selected{background:var(--mun);border-color:var(--mun)}.layout{display:grid;grid-template-columns:335px minmax(0,1fr);gap:14px;align-items:start}.list,.detail,details{background:#fff;border:1px solid var(--line);border-radius:13px}.list{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.day{padding:8px 12px;background:#f7fafb;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}.row{display:block;width:100%;padding:10px 12px;text-align:left;border:0;border-bottom:1px solid #edf2f4;background:#fff;font:inherit;cursor:pointer}.row.active,.row:hover{background:#e8f4f8}.row b,.row span,.row small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.row small{color:var(--muted);font-size:13px}.tag{display:inline-block;margin:5px 5px 0 0;padding:2px 7px;border-radius:99px;background:#e8f2f7;color:var(--blue);font-size:12px}.tag.mun{background:#e7f5ed;color:var(--mun)}.detail{padding:16px}.detail h2{font-size:25px;line-height:1.25}.matrix{display:grid;grid-template-columns:120px 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}.matrix div{padding:8px 10px;border-bottom:1px solid var(--line)}.matrix div:nth-last-child(-n+2){border-bottom:0}.matrix .k{background:#f5f8fa;color:var(--muted);font-size:13px}.section{margin-top:12px;padding:13px;border:1px solid;border-radius:12px}.section.blue{background:#edf7fb;border-color:#b8dbe9}.section.amber{background:#fff8e8;border-color:#e7d39b}.section.green{background:#eef8f1;border-color:#badcc5}.section h3{font-size:17px;margin-bottom:7px}.section ul{margin:0;padding-left:20px}.section li+li{margin-top:7px}.contact{padding:9px 0;border-bottom:1px solid #cfe3d5}.contact:last-child{border:0}details{margin-top:12px;padding:11px}summary{cursor:pointer;color:var(--blue);font-weight:700}.empty{padding:20px;color:var(--muted)}a{color:var(--blue);word-break:break-all}@media(max-width:760px){main{padding:12px}.layout{display:block}.list{position:static;max-height:none;margin-bottom:12px}.detail{padding:13px}.matrix{grid-template-columns:96px 1fr}.filters{padding-bottom:8px}}</style><main><h1>靖帆IMS Intelligence</h1><p class="muted">工业与市政线索 · 数据自动同步仓库 JSON</p><div class="toolbar"><input id="search" class="search" placeholder="搜索公司、项目、地区、事实或联系人"><div id="segment" class="filters"></div><div id="category" class="filters"></div></div><div class="layout"><aside class="list"></aside><article class="detail"></article></div></main><script type="module">const data=await fetch('./leads-data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),list=document.querySelector('.list'),detail=document.querySelector('.detail'),search=document.querySelector('#search'),segment=document.querySelector('#segment'),category=document.querySelector('#category');let seg='industrial',cat='all',chosen=0;const labels={industrial:'工业',municipal:'市政'};function cats(){return [...new Set(data.leads.filter(x=>x.segment===seg).map(x=>x.category))].sort()}function makeFilters(){segment.innerHTML=['industrial','municipal'].map(x=>`<button class="filter ${x===seg?'selected':''} ${x==='municipal'?'municipal':''}" data-s="${x}">${labels[x]}（${data.leads.filter(r=>r.segment===x).length}）</button>`).join('');category.innerHTML=`<button class="filter selected" data-c="all">全部类别</button>`+cats().map(x=>`<button class="filter" data-c="${esc(x)}">${esc(x)}</button>`).join('');segment.querySelectorAll('button').forEach(b=>b.onclick=()=>{seg=b.dataset.s;cat='all';makeFilters();render()});category.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;category.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));render()})}function rows(){const q=search.value.trim().toLowerCase();return data.leads.map((r,i)=>({r,i})).filter(x=>x.r.segment===seg&&(cat==='all'||x.r.category===cat)&&(!q||JSON.stringify(x.r).toLowerCase().includes(q)))}function render(){const rs=rows(),days=[...new Set(rs.map(x=>x.r.date))].sort().reverse();list.innerHTML=days.length?days.map(d=>`<div class="day">${esc(d)}</div>`+rs.filter(x=>x.r.date===d).map(x=>`<button class="row" data-i="${x.i}"><b>${esc(x.r.lead.company?.company_name||'名称未记录')}</b><span>${esc(x.r.lead.project?.project_name||x.r.lead.signal?.signal_description||'项目未记录')}</span><small><i class="tag ${x.r.segment==='municipal'?'mun':''}">${esc(x.r.category)}</i></small></button>`).join('')).join(''):'<div class="empty">没有匹配线索</div>';list.querySelectorAll('.row').forEach(b=>b.onclick=()=>show(+b.dataset.i,true));const visible=rs.map(x=>x.i);show(visible.includes(chosen)?chosen:visible[0]||0)}const facts=x=>(x||[]).map(v=>`<li>${esc(typeof v==='string'?v:JSON.stringify(v))}</li>`).join('')||'<li>未记录</li>';function show(i,scroll=false){chosen=i;const r=data.leads[i],l=r.lead||{},e=r.enriched_record||{},s=e.original_signal||{},ev=s.evidence||{},contacts=r.enriched_contacts||[],sources=s.source_urls||l.signal?.evidence?.map(x=>x.source_url).filter(Boolean)||[];list.querySelectorAll('.row').forEach(x=>x.classList.toggle('active',+x.dataset.i===i));const matrix=a=>`<div class="matrix">${a.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${esc(v||'未记录')}</div>`).join('')}</div>`;detail.innerHTML=`<h2>${esc(l.company?.company_name||s.company||'名称未记录')}</h2><p class="muted">${esc(l.lead_id)} · ${esc(r.date)} <i class="tag ${r.segment==='municipal'?'mun':''}">${labels[r.segment]}／${esc(r.category)}</i></p>${matrix([['项目',l.project?.project_name||s.opportunity],['项目阶段',s.opportunity_stage||l.project?.project_stage],['行业／地区',`${s.industry||l.company?.industry||'未记录'} / ${s.location||l.company?.location||'未记录'}`],['优先级／时间窗口',`${s.priority||s.signal_tier||'未记录'} / ${s.estimated_time_window||'未记录'}`]])}<section class="section blue"><h3>项目背景与公开事实</h3><ul>${facts(ev.facts?.length?ev.facts:[l.signal?.signal_description].filter(Boolean))}</ul></section><section class="section amber"><h3>客户需求与待核实事项</h3>${matrix([['客户需求',s.customer_requirement||s.customer_need],['当前方案／痛点',(ev.inferences||[]).join('；')],['待核实',(Array.isArray(s.to_verify)?s.to_verify:Object.values(s.to_verify||{})).join('；')]])}</section><section class="section green"><h3>软件机会与建议行动</h3>${matrix([['潜在应用',s.potential_ims_use_case],['判断逻辑',s.logic],['建议行动',e.ims_recommendation?.recommended_action||s.pull_box?.next_validation_question]])}</section><section class="section green"><h3>联系人（${contacts.length}）</h3>${contacts.length?contacts.map(c=>`<div class="contact"><b>${esc(c.name||'姓名未记录')}</b> · ${esc(c.title||c.role||'职务未记录')}<br>${esc((c.phone||[]).map(p=>p.value).join('；')||'联系方式未公开')}</div>`).join(''):'<p class="muted">原始资料未关联联系人。</p>'}</section><details><summary>原始资料字段与来源</summary>${matrix(Object.entries(e).filter(([k])=>k!=='original_signal').map(([k,v])=>[k,typeof v==='string'?v:JSON.stringify(v)]))}<ul>${sources.map(x=>`<li><a target="_blank" rel="noreferrer" href="${esc(x)}">${esc(x)}</a></li>`).join('')||'<li>未记录来源链接</li>'}</ul></details>`;if(scroll)detail.scrollIntoView({behavior:'smooth',block:'start'})}search.oninput=render;makeFilters();render();if(matchMedia('(min-width:761px)').matches)setInterval(()=>location.reload(),300000);</script></html>
