<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>靖帆IMS Intelligence</title><style>:root{--ink:#17212b;--muted:#647582;--line:#d9e4e8;--bg:#f4f7f8;--blue:#0e628c;--mun:#176a49}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:16px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,5vw,36px)}.muted{font-size:14px;color:var(--muted)}.toolbar{padding:8px 0}.search{width:100%;padding:12px;border:1px solid #b8cbd4;border-radius:10px;background:#fff;font:inherit}.filters{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px}.filter{flex:0 0 auto;border:1px solid #b8cbd4;border-radius:99px;padding:6px 11px;background:#fff;font:14px inherit;cursor:pointer}.filter.selected{background:var(--blue);border-color:var(--blue);color:#fff}.filter.municipal.selected{background:var(--mun);border-color:var(--mun)}.layout{display:grid;grid-template-columns:335px minmax(0,1fr);gap:14px;align-items:start}.list,.detail,details{background:#fff;border:1px solid var(--line);border-radius:13px}.list{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.day{padding:8px 12px;background:#f7fafb;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}.row{display:block;width:100%;padding:10px 12px;text-align:left;border:0;border-bottom:1px solid #edf2f4;background:#fff;font:inherit;cursor:pointer}.row.active,.row:hover{background:#e8f4f8}.row b,.row span,.row small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.row small{color:var(--muted);font-size:13px}.tag{display:inline-block;margin:5px 5px 0 0;padding:2px 7px;border-radius:99px;background:#e8f2f7;color:var(--blue);font-size:12px}.tag.mun{background:#e7f5ed;color:var(--mun)}.detail{padding:16px}.detail h2{font-size:25px;line-height:1.25}.matrix{display:gri </div></div><div class="layout"><aside class="list"></aside><article class="detail"></article></div></main><script type="module">const data=await fetch('./leads-data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clean=v=>{const x=String(v??'').trim();return !x||/^(unknown|null|n\/a|未记录|未知)$/i.test(x)?'待核实（公开资料未披露）':x.replace(/\bunknown\b/ig,'待核实')},fmt=v=>clean(Array.isArray(v)?v.filter(Boolean).join('；'):(v&&typeof v==='object'?Object.values(v).filter(x=>typeof x==='string').join('；'):v)),stage=v=>{const x=String(v||'').trim();const map={'Tender/Procurement':'招标／采购','EIA-Approval':'环评／审批','Permitting':'环评／审批','Planning-Feasibility':'立项／规划','Planning/Feasibility':'立项／规划','Early Trigger':'立项／规划','EPC/Project Prep':'立项／规划','EPC-Project Prep':'立项／规划','Design':'设计','Execution':'建设／实施','Expansion':'扩产','Industrial iMS Opportunity':'数字化机会','Completed-Too Late':'已投运／过期'};return map[x]||(/^(Agent Discovery|Industrial Signal|Signal|Potential|Potential Industrial Opportunity)$/i.test(x)||!x?'待核实':clean(x))},loc=v=>v&&typeof v==='object'?([v.province,v.city,v.district_county].filter(Boolean).join(' ')||v.raw||'待核实（公开资料未披露）'):clean(v),list=document.querySelector('.list'),detail=document.querySelector('.detail'),search=document.querySelector('#search'),segment=document.querySelector('#segment'),category=document.querySelector('#category'),quality=document.querySelector('#quality');let seg='all',cat='all',qualityFilter='all',chosen=0;for(const r of data.leads){for(const c of r.enriched_contacts||[]){if(c.phone&&!Array.isArray(c.phone))c.phone=[typeof c.phone==='object'?c.phone:{value:c.phone}]}}const labels={all:'全部线索',industrial:'工业',municipal:'市政'};function cats(){return [...new Set(data.leads.filter(x=>seg==='all'||x.segment===seg).map(x=>x.category))].sort()}function makeFilters(){segment.innerHTML=['all','industrial','municipal'].map(x=>`<button class="filter ${x===seg?'selected':''} ${x==='municipal'?'municipal':''}" data-s="${x}">${labels[x]}（${x==='all'?data.leads.length:data.leads.filter(r=>r.segment===x).length}）</button>`).join('');category.innerHTML=`<button class="filter selected" data-c="all">全部类别</button>`+cats().map(x=>`<button class="filter" data-c="${esc(x)}">${esc(x)}</button>`).join('');segment.querySelectorAll('button').forEach(b=>b.onclick=()=>{seg=b.dataset.s;cat='all';makeFilters();render()});category.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;category.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));render()})}function makeQuality(){quality.innerHTML=[['all','资料完整度：全部'],['five','完整 5 分'],['four','较完整 4 分'],['low','待补 0–3 分']].map(([v,t])=>`<button class="filter ${qualityFilter===v?'selected':''}" data-q="${v}">${t}</button>`).join('');quality.querySelectorAll('button').forEach(b=>b.onclick=()=>{qualityFilter=b.dataset.q;makeQuality();render()})}function rows(){const q=search.value.trim().toLowerCase();return data.leads.map((r,i)=>({r,i})).filter(x=>(seg==='all'||x.r.segment===seg)&&(cat==='all'||x.r.category===cat)&&(qualityFilter==='all'||qualityFilter==='five'&&x.r.quality_score===5||qualityFilter==='four'&&x.r.quality_score===4||qualityFilter==='low'&&(x.r.quality_score||0)<=3)&&(!q||JSON.stringify(x.r).toLowerCase().includes(q)))}function render(){const rs=rows(),days=[...new Set(rs.map(x=>x.r.date))].sort().reverse();list.innerHTML=days.length?days.map(d=>`<div class="day">${esc(d)}</div>`+rs.filter(x=>x.r.date===d).map(x=>`<button class="row" data-i="${x.i}"><b>${esc(x.r.lead.company?.company_name||'名称未记录')}</b><span>${esc(x.r.lead.project?.project_name||x.r.lead.signal?.signal_description||'项目未记录')}</span><small><i class="tag ${x.r.segment==='municipal'?'mun':''}">${labels[x.r.segment]}／${esc(x.r.category)}</i><i class="tag">资料 ${x.r.quality_score||0}／5</i></small></button>`).join('')).join(''):'<div class="empty">没有匹配线索</div>';list.querySelectorAll('.row').forEach(b=>b.onclick=()=>show(+b.dataset.i,true));const visible=rs.map(x=>x.i);show(visible.includes(chosen)?chosen:visible[0]||0)}const facts=x=>(x||[]).map(v=>`<li>${esc(typeof v==='string'?v:JSON.stringify(v))}</li>`).join('')||'<li>未记录</li>';function agentPrompt(r){const l=r.lead||{},e=r.enriched_record||{},s=e.original_signal||{},evidence=s.evidence||{},jd=s.jd_inferences||[],salesEvidence=Object.values(s.sales_insight_evidence||{}).flat().filter(Boolean),sources=[...new Set([...(s.source_urls||[]),...salesEvidence.map(x=>x.source_url),...jd.map(x=>x.source_url)])].filter(Boolean),dossier={线索编号:l.lead_id,客户:s.company||l.company?.company_name,项目:s.opportunity||l.project?.project_name,行业:s.industry||l.company?.industry,地区:s.location||l.company?.location,项目阶段:s.opportunity_stage||l.project?.project_stage,优先级:s.priority||s.signal_tier,时间窗口:s.estimated_time_window,时间窗口依据:s.time_window_basis,公开事实:evidence.facts,公开推断:evidence.inferences,客户需求:s.customer_requirement||s.customer_need,当前方案:s.current_solution,业务痛点:s.operational_pain_points||s.pain_points,销售摘要:s.sales_summary,既往尝试:s.prior_attempts,未解决原因:s.why_unresolved,重点待核实:s.next_validation_questions||s.to_verify,'联系人（已按网页规则脱敏）':r.enriched_contacts||[],招聘证据与推断:jd,公开来源:sources};return `你是公司内部线索核实 Agent。请基于下方“公开线索档案”，结合你获授权访问的 CRM、客户历史、拜访纪要、报价/合同、装机、渠道及人员关系数据，生成一份供销售与市场共同使用的线索核实报告。\n\n【边界与证据规则】\n1. 公开资料、公司私有资料、合理推断必须分别标注；没有证据不得补写为事实。\n2. 仅使用被授权的数据；个人联系方式、个人身份与商业敏感信息仅在公司受控交付物中处理。\n3. JD/招聘信息只能证明岗位职责或工作负载，不代表已有预算、采购意向或项目确认。\n\n【报告必须覆盖】\nStage 1｜发现与事实：客户/项目/地区/行业、项目阶段、时间窗口、公开来源、是否重复或已过期。\nStage 2｜资格判断：ICP匹配、与 iMS 的相关性、需求是否真实且紧迫、预算/采购路径/竞争状态、应跟进/培育/淘汰的结论及理由。\nStage 3｜补充与行动：组织与决策链、可用联系人与角色、现有仪表/SCADA/软件/运维方式、历史尝试与未解决问题、下一步行动、负责人、需补证据。\n\n【交付格式】\n先给一页销售摘要，再按 Stage 1/2/3 展开。用表格或要点呈现；每条关键结论附来源类别与置信度。可输出 Word、PDF、Markdown 或 HTML。\n\n【公开线索档案】\n${JSON.stringify(dossier,null,2)}`;}async function copyAgentPrompt(r,button){const text=agentPrompt(r);try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove()}button.textContent='已复制，可发送给公司 Agent';setTimeout(()=>button.textContent='复制公司 Agent 核实提示（提示词）',2200)}catch{button.textContent='复制失败，请重试'}}function show(i,scroll=false){chosen=i;const r=data.leads[i],l=r.lead||{},e=r.enriched_record||{},s=e.original_signal||{},ev=s.evidence||{},project=(e.projects||[])[0]||{},account=(e.accounts||[])[0]||{},water=project.water_system_details||{},jd=s.jd_inferences||[],contacts=r.enriched_contacts||[],sources=s.source_urls||l.signal?.evidence?.map(x=>x.source_url).filter(Boolean)||[];list.querySelectorAll('.row').forEach(x=>x.classList.toggle('active',+x.dataset.i===i));const matrix=a=>`<div class="matrix">${a.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${esc(fmt(v)||'未记录')}</div>`).join('')}</div>`;detail.innerHTML=`<h2>${esc(l.company?.company_name||s.company||'名称未记录')}</h2><p class="muted">${esc(l.lead_id)} · ${esc(r.date)} <i class="tag ${r.segment==='municipal'?'mun':''}">${labels[r.segment]}／${esc(r.category)}</i></p>${matrix([['项目',l.project?.project_name||s.opportunity],['项目阶段',stage(s.opportunity_stage||l.project?.project_stage)],['行业／地区',`${s.industry||l.company?.industry||'未记录'} / ${loc(s.location||l.company?.location)}`],['优先级／时间窗口',`${s.priority||s.signal_tier||'未记录'} / ${s.estimated_time_window||'未记录'}`],['时间窗口依据',s.time_window_basis],['资料完整度',`${r.quality_score||0}／5（待补：${(r.quality_missing||[]).join('、')||'无'}）`]])}<section class="section blue"><h3>项目背景与公开事实</h3><ul>${facts(ev.facts?.length?ev.facts:[l.signal?.signal_description].filter(Boolean))}</ul></section><section class="section green"><h3>销售摘要</h3>${matrix([['机会概述',s.sales_summary],['需求假设',s.demand_hypothesis],['既往尝试',s.prior_attempts],['未解决原因',s.why_unresolved]])}</section>${jd.length?`<section class="section amber"><h3>公开招聘信号（仅作需求验证）</h3>${jd.map(j=>matrix([['招聘岗位',j.job_title],['岗位职责（公开）',j.role_duties],['需求推断',j.software_need],['证据强度',({HIGH:'高',MEDIUM:'中',LOW:'低',UNKNOWN:'待核实'})[j.confidence]||j.confidence],['招聘来源',j.source_url]])).join('')}</section>`:''}<section class="section blue"><h3>项目与系统现状</h3>${matrix([['当前方案',s.current_solution||account.existing_digital_platform||account.digitalization_status],['业务痛点',s.operational_pain_points||s.pain_points||water.instrument_requirements],['当前合作／进展',account.latest_signal]])}</section><section class="section amber"><h3>客户需求与待核实事项</h3>${matrix([['客户明确需求',s.customer_requirement||s.customer_need],['重点待核实',(Array.isArray(s.to_verify)?s.to_verify:Object.values(s.to_verify||{})).join('；')],['建议优先确认',account.action_needed||s.pull_box?.next_validation_question]])}${(r.quality_score||0)>=4?'<button class="copy-prompt" type="button">复制公司 Agent 核实提示（提示词）</button>':''}</section><section class="section green"><h3>软件机会与建议行动</h3>${matrix([['潜在应用',s.potential_ims_use_case],['判断摘要',(ev.inferences||[]).map(x=>String(x).split('。')[0]).filter(Boolean).slice(0,2).join('；')||s.logic],['建议行动',e.ims_recommendation?.recommended_action||s.pull_box?.next_validation_question]])}</section><section class="section green"><h3>联系人（${contacts.length}）</h3>${contacts.length?contacts.map(c=>`<div class="contact"><b>${esc(c.name||'姓名未记录')}</b> · ${esc(c.title||c.role||'职务未记录')}${c.unit?`<br><span class="muted">${esc(c.unit)}</span>`:''}<br>${esc((Array.isArray(c.phone)?c.phone:(c.phone?[c.phone]:[])).map(p=>typeof p==='object'?(p.value||p.number||p.mobile||''):p).filter(Boolean).join('；')||'联系方式未公开')}</div>`).join(''):'<p class="muted">原始资料未关联联系人。</p>'}</section><details><summary>原始资料与来源</summary>${matrix([['数据状态',e.enrichment_status],['关联项目／账户',`${(e.projects||[]).length} / ${(e.accounts||[]).length}`],['关联联系人',contacts.length],['公开来源',sources.length]])}<ul>${sources.map(x=>`<li><a target="_blank" rel="noreferrer" href="${esc(x)}">${esc(x)}</a></li>`).join('')||'<li>未记录来源链接</li>'}</ul></details>`;detail.querySelector('.copy-prompt')?.addEventListener('click',event=>copyAgentPrompt(r,event.currentTarget));if(scroll)detail.scrollIntoView({behavior:'smooth',block:'start'})}search.oninput=render;makeFilters();makeQuality();render();if(matchMedia('(min-width:761px)').matches)setInterval(()=>location.reload(),300000);if(matchMedia('(max-width:760px)').matches){document.addEventListener('click',event=>{if(event.target.closest('.row'))setTimeout(()=>{document.body.classList.add('show-detail');if(!detail.querySelector('.back-to-list'))detail.insertAdjacentHTML('afterbegin','<button class="back-to-list" type="button">← 返回线索列表</button>');window.scrollTo(0,0)},0)});detail.addEventListener('click',event=>{if(event.target.closest('.back-to-list')){document.body.classList.remove('show-detail');window.scrollTo(0,0)}})}</script></html>
